<style>
/* Layout: one narrow column a rep can glance at. Role first, six quick buttons, one answer card, search below. */
:root {
  --bg: #F1F5F1;
  --surface: #FFFFFF;
  --ink: #15241C;
  --muted: #5A6B60;
  --line: #D3DCD5;
  --accent: #0B6E4F;
  --accent-ink: #FFFFFF;
  --say-bg: #E2F1E9;
  --warn-bg: #FBEFD6;
  --warn-ink: #6B4A07;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1612; --surface: #18221C; --ink: #E6EEE8; --muted: #9AA99F; --line: #2B3930;
    --accent: #5FCB9B; --accent-ink: #0B1A13; --say-bg: #1B3026; --warn-bg: #33290F; --warn-ink: #F0D28A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1612; --surface: #18221C; --ink: #E6EEE8; --muted: #9AA99F; --line: #2B3930;
  --accent: #5FCB9B; --accent-ink: #0B1A13; --say-bg: #1B3026; --warn-bg: #33290F; --warn-ink: #F0D28A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 40px;
}
[hidden] { display: none !important; }
.wrap { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--display); font-size: 1.7rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.tag { font-family: var(--mono); font-size: 0.72rem; background: var(--warn-bg); color: var(--warn-ink); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.sub { margin: 0; color: var(--muted); font-size: 0.92rem; flex-basis: 100%; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.roles { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.roles button { border: 0; background: transparent; padding: 8px 14px; font-weight: 500; font-size: 0.9rem; border-right: 1px solid var(--line); }
.roles button:last-child { border-right: 0; }
.roles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.cues { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 480px) { .cues { grid-template-columns: repeat(2, 1fr); } }
.cues button {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 10px; text-align: left; font-weight: 600; font-size: 0.95rem; line-height: 1.2; min-width: 0;
}
.cues button small { display: block; font-weight: 400; color: var(--muted); font-size: 0.78rem; margin-top: 3px; }
.cues button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.answer .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.answer h2 { font-family: var(--display); font-size: 1.15rem; margin: 0; text-wrap: balance; }
.lead { background: var(--say-bg); border-radius: 8px; padding: 12px 16px 14px; }
.lead .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.lead p { font-size: 1.1rem; line-height: 1.4; font-weight: 500; margin: 2px 0 0; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: start; }
@media (max-width: 480px) { .row { grid-template-columns: 1fr; gap: 2px; } }
.row .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; padding-top: 3px; }
.row .v { margin: 0; min-width: 0; }
.row ul, .row ol { margin: 0; padding-left: 18px; }
.src { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; }
.miss { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 14px 16px; margin: 0; }
.related { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.related span { font-size: 0.82rem; color: var(--muted); }

.ask form { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; }
.ask form button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 0 18px; font-weight: 600; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 0.82rem; color: var(--muted); text-align: left; }
.asked { margin: 0; font-size: 0.9rem; color: var(--muted); }
.asked b { color: var(--ink); font-weight: 500; }
footer { color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 14px; }
footer p { margin: 0; max-width: 65ch; }
</style>
</head>

<div class="wrap">
  <header>
    <h1>Playbook Quick Search</h1>
    <span class="tag">PROTOTYPE</span>
    <p class="sub">Pick your role, then tap a situation or search. Every answer comes from the sales playbook.</p>
  </header>

  <section>
    <p class="label">I work in</p>
    <div class="roles" id="roles" role="group" aria-label="Sales role">
      <button type="button" data-role="inside">Inside sales</button>
      <button type="button" data-role="outside">Outside sales</button>
      <button type="button" data-role="counter">Counter sales</button>
    </div>
  </section>

  <section>
    <p class="label">Quick answers</p>
    <div class="cues">
      <button type="button" data-id="opener">Open a cold call<small>Five step outline</small></button>
      <button type="button" data-id="gotaguy">“I’ve got a guy”<small>Already has a supplier</small></button>
      <button type="button" data-id="account">Open an account<small>The main ask</small></button>
      <button type="button" data-id="price">Price objection<small>“They’re cheaper”</small></button>
      <button type="button" data-id="hubspot">Log it in HubSpot<small>What to record</small></button>
      <button type="button" data-id="handoff">Hand off a customer<small>5 step checklist</small></button>
    </div>
  </section>

  <section class="answer" id="answer" aria-live="polite"></section>

  <section class="ask">
    <p class="label">Search the playbook</p>
    <form id="ask-form">
      <input id="ask-input" type="text" autocomplete="off" placeholder="Try: they didn't pick up" aria-label="Search the playbook">
      <button type="submit">Search</button>
    </form>
  </section>

  <footer>
    <p>Capstone Group 1 prototype. Answers come from Sales Playbook V1, sections 2 and 4. Keyword search only, no AI.</p>
  </footer>
</div>

    return r;
  }

  function show(id) { state.id = id; state.question = ""; state.related = []; render(); }

  function render() {
    answerEl.textContent = "";
    if (state.question) {
      var q = el("p", "asked");
      q.appendChild(document.createTextNode("You searched "));
      q.appendChild(el("b", null, "“" + state.question + "”"));
      answerEl.appendChild(q);
    }
    if (!state.id) {
      answerEl.appendChild(el("h2", null, "Not in the playbook"));
      answerEl.appendChild(el("p", "miss", "Nothing in the playbook matches that. Try different words, or ask your branch manager and flag the question so it gets added."));
      var s0 = el("div", "src");
      s0.appendChild(el("span", null, "Source · none found"));
      answerEl.appendChild(s0);
    } else {
      var e = CARDS[state.id];
      var body = e.byRole ? e.byRole[state.role] : e.body;
      var head = el("div", "head");
      head.appendChild(el("h2", null, e.title));
      answerEl.appendChild(head);
      var lead = el("div", "lead");
      lead.appendChild(el("div", "k", body.leadLabel));
      lead.appendChild(el("p", null, body.lead));
      answerEl.appendChild(lead);
      body.rows.forEach(function (r) { answerEl.appendChild(row(r[0], r[1])); });
      var s = el("div", "src");
      s.appendChild(el("span", null, "Source · " + (body.src || e.src || SEC[state.role])));
      if (e.byRole) s.appendChild(el("span", null, "Role · " + ROLE_NAMES[state.role]));
      answerEl.appendChild(s);
    }
    if (state.related.length) {
      var rel = el("div", "related");
      rel.appendChild(el("span", null, "Also related"));
      state.related.forEach(function (id) {
        var b = el("button", "chip", CARDS[id].title);
        b.type = "button";
        b.addEventListener("click", function () {
          state.related = state.related.filter(function (x) { return x !== id; }).concat(state.id ? [state.id] : []);
          state.id = id;
          render();
        });
        rel.appendChild(b);
      });
      answerEl.appendChild(rel);
    }
    document.querySelectorAll(".cues button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(!state.question && b.dataset.id === state.id));
    });
    document.querySelectorAll("#roles button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.role === state.role));
    });
  }

  /* Returns card ids ranked by how well the text matches their keys. */
  function rank(text) {
    var t = " " + text.toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9%' -]+/g, " ").replace(/\s+/g, " ") + " ";
    var scored = [];
    Object.keys(CARDS).forEach(function (id) {
      var score = 0;
      CARDS[id].keys.forEach(function (k) {
        var hit = /^[a-z0-9]/.test(k) ? t.indexOf(" " + k) !== -1 : t.indexOf(k) !== -1;
        if (hit) score += k.length;
      });
      if (score > 0) scored.push([id, score]);
    });
    scored.sort(function (a, b) { return b[1] - a[1]; });
    return scored.map(function (s) { return s[0]; });
  }

  function search(text) {
    text = text.trim();
    if (!text) return;
    var ids = rank(text);
    state.question = text;
    state.id = ids[0] || null;
    state.related = ids.slice(1, 4);
    render();
  }

  document.querySelectorAll(".cues button").forEach(function (b) {
    b.addEventListener("click", function () { show(b.dataset.id); });
  });
  document.querySelectorAll("#roles button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.role = b.dataset.role;
      try { localStorage.setItem("pqs-role", state.role); } catch (e) {}
      render();
    });
  });
  document.getElementById("ask-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    search(input.value);
  });

  render();
})();
</script>
</body>
</html>
